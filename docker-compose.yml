services:
  web:
    build: .
    image: my-web:compose
    container_name: compose-web
    environment:                          # 컨테이너 안으로 전달할 환경 변수
      APP_ENV: ${APP_ENV:-dev}
      NGINX_PORT: ${NGINX_PORT:-80}
    volumes:
      - ./nginx:/etc/nginx/templates:ro   # nginx 템플릿 연결 (읽기 전용)
    ports:
      - "${WEB_PORT:-8090}:${NGINX_PORT:-80}"

  checker:
    image: curlimages/curl:8.11.1
    container_name: compose-checker
    depends_on:
      - web
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          echo "[$(date +%T)] $(curl -s http://web:${NGINX_PORT:-80} | grep -o '<h1>.*</h1>')"
          sleep 5
        done
